name: Quant Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Quant Dependencies
        run: |
          pip install requests pandas numpy scipy catboost pytz

      - name: Execute Inference Engine
        run: |
          python run_bot.py

      - name: Commit and Push Market Data
        run: |
          git config --global user.name "quant bot"
          git config --global user.email "bot@quant.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update global market probabilities"
          git push
